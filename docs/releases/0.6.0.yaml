# Release notes for TravelRepo 0.6.0. They go into CHANGELOG.md and the GitHub release.
version: 0.6.0
date: 2026-10-24
changes:
  - en: "Packing lists (specification section 37.1) use existing types, so the format stays at 1.0 and older clients see a collection of tasks. A list is a collection with `purpose: packing`; an item is a task with a `packing` component for its group, quantity, the people who bring it, `everyone` and `packed_by`."
  - en: PackingLists works out who brings an item, who has packed it, what nobody has taken yet and how items are grouped, and keeps the task status in step. `packed_by` merges as a set, so people packing at the same time do not conflict.
  - en: TripPeople suggests which person in a trip is the local user, by GitHub login first and then by Git e-mail, and only when exactly one person matches (specification section 51). ReminderKind.WhoAmI asks when nothing matches.
  - en: ExportOptions and ExportFilter choose the parts, a date range, one person, detailed or compact and the paper size, with the rules in specification section 45.1. TripExport.Document describes the export without a renderer; HTML and plain text render it, and ICS follows the date range and person.
  - en: Places.Location and ContactDetails read place data, which the weather now uses too. Notes are read from an item's `body` as well as from Markdown content entries.
  - en: Stays.Runs joins consecutive nights at the same place. Exports show check-in, check-out and each night, name the trip's time zone, and show both local times when an item starts or ends in another zone. ExportTimeline places each day's plans on a time line.
  - en: PackingExport writes packing lists for everyone, one person or what nobody brings yet, as text with check boxes or as CSV with the culture's separator and protection against formula cells.
  - en: "CLI: `export` takes `--from`, `--to`, `--person`, `--parts`, `--compact` and writes `.txt`. The new `export-lists` writes packing lists as `.txt` or `.csv`."
  - en: "MCP: get_packing_lists, create_packing_list, add_packing_item, assign_packing_item and set_packed work with packing lists, and export_text returns the plan or the packing lists as text."
