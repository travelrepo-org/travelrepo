# Release notes for TravelRepo 0.13.0. They go into CHANGELOG.md and the GitHub release.
version: 0.13.0
date: 2026-11-16
changes:
  - en: "New API: `TripSearch` is a full-text search over a trip: plans, bookings, costs, places, tasks, packing, notes and files. It ignores case and accents (\"Wanaka\" finds \"Wānaka\"), takes each word as the beginning of a word, allows one typo in words of five letters or more, and requires every word. Hits come best first, with the day they belong to and the fields that matched, with ranges to highlight. Note texts are searched only on request; `SearchLabels` adds category names in the client's language. The index is kept per `TripSnapshot`, and `TripSearch.ByDay` groups hits by day, today first during the trip."
  - en: "MCP: `search` finds entities by words with the same engine, so an assistant can answer questions such as \"on which day is the temple visit?\" without reading the whole trip."
  - en: "New API: `ExpenseCategories.SuggestFromTitle` suggests a category from the title of an expense: the category of an earlier expense with the same title, otherwise what a word says in English or German, such as transport for \"Taxifahrt\" or food for \"Restaurant\". Clients offer it; nothing is stored by itself (specification section 34.2)."
  - en: "Releases are pushed to nuget.org with trusted publishing, after the packages are attached to the GitHub release. No API key is stored; `docs/development.md` says what to set up."
  - en: "The New Zealand conformance fixture has two places with macrons, Wānaka and Kaikōura."
