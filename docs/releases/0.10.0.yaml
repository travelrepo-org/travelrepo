# Release notes for TravelRepo 0.10.0. They go into CHANGELOG.md and the GitHub release.
version: 0.10.0
date: 2026-11-12
changes:
  - en: "TravelRepo.Git.LibGit2 runs on iPhone and iPad. eng/build-libgit2-ios.sh builds the libgit2 commit LibGit2Sharp loads (libgit2 1.8.6) as git2.xcframework for devices and the simulator, with the system's zlib and, as on Android, without HTTPS and SSH in libgit2, because ManagedHttpTransport uses .NET's HttpClient and with it the system's TLS. iOS loads libraries only from frameworks, so an app passes the path of git2.framework/git2 to LibGit2Library.Use before its first Git command."
  - en: "LibGit2Library.Use loads libgit2 at once and says why it cannot (DllNotFoundException), instead of failing at the first Git command. Calling it again with the same path does nothing; another path is refused. A test checks that LibGit2Library.Name is still the name LibGit2Sharp loads, so a LibGit2Sharp update that changes it is noticed here and not in an app."
  - en: "A device build for iOS needs the Mono interpreter (UseInterpreter), because LibGit2Sharp passes delegates to libgit2 without MonoPInvokeCallback; docs/spike-git-without-cli.md has the iOS notes."
