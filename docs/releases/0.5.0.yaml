# Release notes for TravelRepo 0.5.0. They go into CHANGELOG.md and the GitHub release.
version: 0.5.0
date: 2026-10-20
changes:
  - en: The new TravelRepo.Providers.Weather package gives clients weather for a trip without writing anything into it. Built-in services are Open-Meteo (default and fallback), MET Norway, the US National Weather Service and Visual Crossing with a personal key. Requests contain only coordinates rounded to two decimals.
  - en: WeatherService works out the places and dates a trip needs, asks the chosen service first and falls back to Open-Meteo. Beyond the forecasts it uses climate averages from the last ten years. WeatherCache keeps everything on the device.
  - en: WeatherAdvice decides when weather matters for an item and turns concerns within three days into WeatherWarning reminders.
  - en: The optional, inheritable `outdoor` field states whether an item happens outdoors (specification section 25.2). Without it, OutdoorEstimates estimates it from the transport type, the category and English and German title words, and says why.
  - en: "MCP: get_weather returns the weather a client has already cached, never live data, through WeatherService.CacheOnly, which cannot download. get_schedule shows the outdoor estimate."
  - en: MailHtml makes e-mail HTML safe to show in its original layout, and MailMessage carries the HTML part and its inline images.
fixes:
  - en: Running Git in a trip folder that was moved or deleted reports git.folder_missing instead of failing with a platform error.
