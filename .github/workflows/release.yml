name: Release
# Runs when a maintainer publishes a GitHub release. Its first step turns the release into a pre-release, however it
# was published, so it is not the latest release before its packages are attached. The release tag must be
# v + <Version> from Directory.Build.props. Title and notes may be left empty: a release without a title is named
# "TravelRepo <version>", and the notes from docs/releases are written below whatever the release already says.
# The workflow builds and tests the tagged commit, attaches the NuGet packages and then turns a release with a plain
# version tag (v1.2.3) into a full, latest release; tags with a suffix (v1.2.3-beta.1) stay pre-releases. If anything
# fails, the release goes back to draft so nobody uses it; fix the problem and publish it again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published release to check and build again, for example v0.2.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before anything else, so that a release published as a full release is not the latest one without its packages.
      - name: Make the release a pre-release until its packages are attached
        if: github.event_name == 'release' && github.event.release.prerelease != true
        run: gh release edit "$TAG" --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: python3 eng/version.py --check-tag "$TAG" --github
      # Nothing is built when the release notes for this version are missing or CHANGELOG.md is out of date.
      - name: Check the release notes
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 eng/changelog.py --check --github
      - name: Write the release text below what is already there
        if: github.event_name == 'release'
        run: |
          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/existing.md"
          python3 eng/changelog.py --release-body "$TAG" --existing "$RUNNER_TEMP/existing.md" > "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md" --repo "$GITHUB_REPOSITORY"
      - name: Title the release when it has no title
        if: github.event_name == 'release'
        env:
          TITLE: ${{ github.event.release.name }}
        run: |
          if [ -z "$TITLE" ] || [ "$TITLE" = "$TAG" ]; then
            gh release edit "$TAG" --title "TravelRepo ${TAG#v}" --repo "$GITHUB_REPOSITORY"
          fi
  verify:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Use the pinned SDK
        shell: bash
        run: cp eng/sdk.json global.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: eng/sdk.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml==6.0.2
      - run: dotnet restore --locked-mode
      - run: dotnet build TravelRepo.sln -c Release --no-restore
      - run: dotnet test TravelRepo.sln -c Release --no-build
      - run: python eng/verify.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Use the pinned SDK
        shell: bash
        run: cp eng/sdk.json global.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: eng/sdk.json
      - run: dotnet restore --locked-mode
      - run: dotnet pack TravelRepo.sln -c Release --no-restore -o artifacts/packages
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/packages/*.nupkg --clobber --repo "$GITHUB_REPOSITORY"
      - name: Turn the pre-release into a full release
        # Every published release starts as a pre-release (see the first step); once everything is attached, a tag
        # without a suffix (v1.2.3) becomes a full, latest release. Tags with a suffix (v1.2.3-beta.1) stay pre-releases.
        if: github.event_name == 'release' && !contains(env.TAG, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
  return-to-draft:
    needs: [version, verify, publish]
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Turn the release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=true --repo "$GITHUB_REPOSITORY"
          echo "::error::The release $TAG failed its checks and is a draft again. See the failed job above, fix it, then publish the release again."
